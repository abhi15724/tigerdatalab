[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tigerdatalab-vercel-staging"
version = "0.1.0"
description = "Isolated Vercel staging API for the published TigerDataLab package"
requires-python = "~=3.12.0"
dependencies = [
  "tigerdatalab[deployment]==4.1.1",
]

[tool.setuptools]
py-modules = ["app"]
