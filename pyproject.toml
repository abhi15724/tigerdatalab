[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tigerdatalab"
version = "4.1.1"
description = "Unified production-oriented data analytics, data science, data engineering, AI training and company AI platform."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Abhi" }]
keywords = ["data-analysis", "data-science", "data-engineering", "business-intelligence", "dataops", "etl", "dashboard", "llm", "rag", "ai-agents", "workflows", "training-data", "fine-tuning", "model-agnostic", "evaluation", "company-ai", "deployment", "enterprise-ai", "connectors", "rbac", "audit"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "openpyxl>=3.1",
    "plotly>=5.18",
    "charset-normalizer>=3.0",
]

[project.optional-dependencies]
large = ["duckdb>=0.10", "pyarrow>=14.0"]
pdf = ["reportlab>=4.0"]
train = ["datasets>=2.18", "transformers>=4.40", "trl>=0.8", "accelerate>=0.27", "torch>=2.1", "peft>=0.10"]
deployment = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
all = ["duckdb>=0.10", "pyarrow>=14.0", "reportlab>=4.0", "fastapi>=0.110", "uvicorn[standard]>=0.29", "datasets>=2.18", "transformers>=4.40", "trl>=0.8", "accelerate>=0.27", "torch>=2.1", "peft>=0.10"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "httpx2"]

[project.urls]
Homepage = "https://github.com/abhi15724/tigerdatalab"
Repository = "https://github.com/abhi15724/tigerdatalab"
Documentation = "https://github.com/abhi15724/tigerdatalab#readme"

[project.scripts]
tigerdatalab = "tigerdatalab.cli.main:main"

[tool.setuptools.packages.find]
include = ["tigerdatalab*"]
