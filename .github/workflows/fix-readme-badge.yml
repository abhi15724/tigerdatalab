name: Fix README PyPI badge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-badge:
    if: ${{ !contains(github.event.head_commit.message, 'Update README PyPI download badge') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace rate-limited PyPI downloads badge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          old = '<a href="https://img.shields.io/pypi/dm/tigerdatalab.svg"><img src="https://img.shields.io/pypi/dm/tigerdatalab.svg?style=for-the-badge&logo=pypi&logoColor=white" alt="PyPI downloads"></a>'
          new = '<a href="https://pepy.tech/project/tigerdatalab"><img src="https://api.pepy.tech/badge/tigerdatalab/month?style=for-the-badge&logo=pypi&logoColor=white" alt="PyPI monthly downloads"></a>'
          if old not in s:
              raise SystemExit('README badge pattern not found; no change made')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Update README PyPI download badge'
          git push
