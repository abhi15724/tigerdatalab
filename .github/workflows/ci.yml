name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,deployment,pdf,large]"

      - name: Run test suite
        run: python -m pytest -v

      - name: Smoke-test the CLI
        run: |
          tigerdatalab analyze tests/data/sales.csv

  package:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build source and wheel distributions
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Smoke-test wheel installation
        run: |
          python -m venv /tmp/tigerdatalab-wheel-test
          /tmp/tigerdatalab-wheel-test/bin/python -m pip install --upgrade pip
          /tmp/tigerdatalab-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/tigerdatalab-wheel-test/bin/python -c "import tigerdatalab; print('TigerDataLab import OK')"
