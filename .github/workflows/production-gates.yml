name: Production gates

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    name: PostgreSQL integration (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tigerdatalab
          POSTGRES_PASSWORD: tigerdatalab_test_password
          POSTGRES_DB: tigerdatalab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tigerdatalab -d tigerdatalab_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TIGERDATALAB_TEST_POSTGRES_DSN: postgresql://tigerdatalab:tigerdatalab_test_password@localhost:5432/tigerdatalab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and PostgreSQL test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres]"
      - name: Run real PostgreSQL integration tests
        run: python -m pytest -v tests/test_postgres_integration.py

  dependency-audit:
    name: Python dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,deployment,pdf,large,postgres]" pip-audit
      - name: Audit installed Python dependencies
        run: pip-audit
